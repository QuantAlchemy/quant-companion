packages:
  - .

allowBuilds:
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - js-yaml@4.3.1
  - nanoid@3.3.18

overrides:
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  uuid@<11.1.1: ^11.1.1
